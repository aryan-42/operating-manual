<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryan Operating Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a field manual. Fixed numbered index on the left, one reading column, ruled panels for standards and fill-in pages. */
  --paper:#eef1f5; --panel:#ffffff; --ink:#111a2b; --muted:#56627a; --line:#cbd3df;
  --accent:#1c4fd6; --accent-soft:#e3eafb; --brass:#8a5f12; --good:#1f7a4d; --warn:#b4541a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0b111c; --panel:#121a29; --ink:#e3e9f3; --muted:#93a0b8; --line:#27334b;
    --accent:#86a8ff; --accent-soft:#17233d; --brass:#d9ac5a; --good:#5cc793; --warn:#f0935a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b111c; --panel:#121a29; --ink:#e3e9f3; --muted:#93a0b8; --line:#27334b;
  --accent:#86a8ff; --accent-soft:#17233d; --brass:#d9ac5a; --good:#5cc793; --warn:#f0935a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
nav.index{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:24px 16px 24px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:8px;text-transform:none}
nav.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.index a{display:flex;gap:10px;align-items:baseline;padding:5px 8px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:14px}
nav.index a:hover{background:var(--accent-soft)}
nav.index a span{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:18px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.sync b{font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.dot.ok{background:var(--good)}
main{padding:32px clamp(16px,4vw,56px) 96px;min-width:0}
.col{max-width:760px}
header.top h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,68px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin:0 0 12px;text-wrap:balance}
header.top p{font-size:18px;color:var(--muted);margin:0 0 20px;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;align-items:center}
.meta b{color:var(--ink);font-weight:500}
.meta input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
section{padding-top:56px}
h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;margin:0 0 6px;display:flex;gap:14px;align-items:baseline;text-wrap:balance}
h2 .n{font-family:var(--mono);font-weight:400;font-size:14px;color:var(--accent)}
.lede{color:var(--muted);font-size:17px;margin:0 0 20px;max-width:62ch}
h3{font-family:var(--display);font-weight:600;font-size:23px;text-transform:uppercase;letter-spacing:.03em;margin:32px 0 8px}
h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
p{margin:0 0 12px;max-width:68ch}
ul,ol{margin:0 0 12px;padding-left:20px;max-width:68ch}
li{margin-bottom:4px}
sup a{font-family:var(--mono);font-size:11px;text-decoration:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:16px 0}
.ev{border-left:3px solid var(--brass)}
.ev h4{color:var(--brass)}
.wb{background:var(--accent-soft);border-color:var(--accent)}
.wb h4{color:var(--accent)}
.warnp{border-left:3px solid var(--warn)}
.warnp h4{color:var(--warn)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.tier{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:6px;padding:14px 16px}
.tier.t2{border-top-color:var(--accent)}
.tier.t3{border-top-color:var(--brass)}
.tier h4{display:flex;justify-content:space-between;gap:8px}
.tier h4 i{font-style:normal;color:var(--ink)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;padding:5px 0;border-top:1px dashed var(--line);cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.pill.s{color:var(--good)} .pill.m{color:var(--brass)} .pill.c{color:var(--warn)}
.fld{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld label{font-size:13.5px;font-weight:500}
.fld small{color:var(--muted);font-size:12.5px}
textarea,input[type=text],input[type=number]{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.scroll{overflow-x:auto}
.score{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.score:first-of-type{border-top:0}
.score label{font-weight:500;font-size:14.5px}
.score input[type=range]{width:100%;accent-color:var(--accent)}
.score output{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--mono);font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sum b{font-size:22px;font-family:var(--display);font-weight:700;margin-right:6px}
button{font:inherit;font-size:14px;font-weight:500;color:var(--panel);background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button.sm{font-size:12px;padding:3px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.note{font-size:13.5px;color:var(--muted)}
.phase{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.phase .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.phase .when b{display:block;font-family:var(--display);font-size:24px;font-weight:700;color:var(--ink);text-transform:uppercase;line-height:1.05;margin-bottom:4px}
.phase ul{margin-bottom:0}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (max-width:900px){
  .shell{display:block}
  nav.index{position:sticky;top:0;z-index:5;height:auto;background:var(--paper);border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;gap:8px}
  .brand{font-size:18px} .brand small{display:none}
  nav.index ol{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav.index a{white-space:nowrap;border:1px solid var(--line);padding:3px 9px;font-size:13px}
  .sync{border-top:0;padding-top:0;flex-direction:row;flex-wrap:wrap;gap:4px 12px}
  .sync .hide-s{display:none}
  html{scroll-padding-top:110px}
  .tiers,.two{grid-template-columns:minmax(0,1fr)}
  .phase{grid-template-columns:minmax(0,1fr);gap:6px}
  .score{grid-template-columns:76px minmax(0,1fr) 28px}
}

/* 1.1 additions */
nav.index li.part{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);padding:12px 8px 3px}
nav.index li.part:first-child{padding-top:0}
nav.index a em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
.sumry{border-top:3px solid var(--ink)}
.sumry dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0}
.sumry dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.sumry dd{margin:0}
details.pb{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:10px 0}
details.pb>summary{cursor:pointer;padding:12px 18px;font-weight:600;display:flex;gap:12px;align-items:baseline;list-style:none}
details.pb>summary::-webkit-details-marker{display:none}
details.pb>summary::before{content:"+";font-family:var(--mono);color:var(--accent);width:10px;flex:none}
details.pb[open]>summary::before{content:"\2212"}
details.pb>summary small{font-weight:400;color:var(--muted);font-size:13.5px}
details.pb>.in{padding:2px 20px 16px;border-top:1px dashed var(--line)}
details.pb>.in>:first-child{margin-top:14px}
.ck .dt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--good);white-space:nowrap;padding-left:8px}
td input[type=text]{padding:5px 8px;font-size:14px;min-width:86px}
td.lab{font-weight:500}
td small,th small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.calc{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--mono);font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.calc b{font-size:22px;font-family:var(--display);font-weight:700;margin-right:6px}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.spark{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.spark h4{margin:0 0 2px;display:flex;justify-content:space-between}
.spark h4 i{font-style:normal;color:var(--ink)}
.spark svg{display:block;width:100%;height:44px}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--accent-soft);stroke:none}
.spark .pt{fill:var(--accent)}
.spark .gr{stroke:var(--line);stroke-width:1}
.sprint{border-collapse:collapse;width:100%}
.sprint th,.sprint td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}
.sprint td:first-child,.sprint th:first-child{text-align:left;min-width:150px;padding-left:0}
.sprint input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.sprint input[type=text]{min-width:140px}
.wk td,.wk th{font-size:13.5px;padding:6px 8px}
.wk td:first-child{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.verdict{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.verdict.no{color:var(--warn)} .verdict.part{color:var(--brass)}
@media (max-width:900px){
  nav.index li.part{display:none}
  .sumry dl{grid-template-columns:minmax(0,1fr);gap:2px 0}
  .sumry dd{margin-bottom:8px}
}
/* 2.0 additions */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.find{position:relative}
.find input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
#qOut{display:flex;flex-direction:column;gap:3px;margin-top:6px;max-height:46vh;overflow-y:auto}
#qOut:empty{display:none}
#qOut button{display:block;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:13px;line-height:1.35;padding:6px 8px}
#qOut button:hover{border-color:var(--accent)}
#qOut button b{display:block;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass)}
#qOut .none{font-size:13px;color:var(--muted);margin:4px 2px}
.hit{outline:2px solid var(--brass);outline-offset:3px;border-radius:3px}
dl.gl{display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px 16px;margin:0 0 12px;max-width:68ch}
dl.gl dt{font-weight:600}
dl.gl dd{margin:0}
td small{margin-top:2px}
@media (max-width:900px){
  #qOut{position:absolute;left:0;right:0;top:100%;z-index:6;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px;max-height:60vh;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  html{scroll-padding-top:150px}
  dl.gl{grid-template-columns:minmax(0,1fr);gap:2px 0}
  dl.gl dd{margin-bottom:8px}
  .score{grid-template-columns:90px minmax(0,1fr) 28px}
}
</style>
</head>
